[package]
name = "dnsd-rs"
version = "0.1.0"
edition = "2021"
description = "Self-built Rust DNS recursive resolver: MySQL primary store, L1+L2+L3 tiered cache, ECS, IPv6->IPv4 dualstack derivation, domain blocking, custom zones, 等保 audit logging"
license = "MIT"

[[bin]]
name = "dnsd"
path = "src/main.rs"

[dependencies]
mysql = "28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
encoding_rs = "0.8"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
